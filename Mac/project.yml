name: JarvisMac
options:
  bundleIdPrefix: com.jarvis.mac
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    # Hardened runtime is REQUIRED for Developer ID notarization. It works with
    # ad-hoc ("-") signing for local Debug builds too, so it is enabled globally.
    ENABLE_HARDENED_RUNTIME: YES
    # Phase-2: search path for the optional sherpa-onnx xcframework drop.
    # Pointing Xcode at an empty Vendor/ is harmless until you install
    # the framework.
    FRAMEWORK_SEARCH_PATHS:
      - $(inherited)
      - $(SRCROOT)/Vendor

# SwiftPM packages.
# - onnxruntime: required for Supertonic neural TTS (in-process ONNX inference).
#   SupertonicTTSBackend is gated by `#if canImport(onnxruntime)` so the project
#   still builds without it — Supertonic will report "not compiled in".
# - whisper: optional Phase-2 offline STT (commented out until pinned).
# packages: (none currently — onnxruntime removed because v1.16.0 has no macOS slice;
# SupertonicTTSBackend is gated with #if canImport(OnnxRuntimeBindings) so it builds without it.
# To re-enable, add onnxruntime-swift-package-manager pinned to ≥1.19.0)
# Uncomment to enable offline wake-word STT:
#   whisper:
#     url: https://github.com/ggerganov/whisper.cpp
#     branch: master

targets:
  JarvisMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: JarvisMac
        excludes:
          - "Resources/Info.plist"
          - "Resources/JarvisMac.entitlements"
    resources:
      - path: JarvisMac/Resources/Assets.xcassets
    info:
      path: JarvisMac/Resources/Info.plist
      properties:
        CFBundleName: Jarvis
        CFBundleDisplayName: Jarvis
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        # Menubar (accessory) app — no Dock icon, no default window.
        LSUIElement: true
        NSHighResolutionCapable: true
        NSMicrophoneUsageDescription: "Jarvis listens for your voice commands."
        NSCameraUsageDescription: "Jarvis uses the webcam for vision features."
        NSSpeechRecognitionUsageDescription: "Jarvis transcribes your voice on-device."
        NSAppleEventsUsageDescription: "Jarvis controls other apps when you ask it to."
        NSLocalNetworkUsageDescription: "Jarvis pairs with your Android app over your local network."
        LSApplicationCategoryType: public.app-category.utilities
    entitlements:
      path: JarvisMac/Resources/JarvisMac.entitlements
      properties:
        com.apple.security.app-sandbox: false
    configFiles:
      # Release signing (Developer ID + team) lives in Signing.xcconfig so the
      # team id is never hard-coded. Fill it in on the signing machine / CI.
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jarvis.mac.JarvisMac
        PRODUCT_NAME: JarvisMac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
      configs:
        # Local development: ad-hoc sign, no team required.
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "-"
          DEVELOPMENT_TEAM: ""
        # Release values are supplied by Signing.xcconfig (CODE_SIGN_IDENTITY,
        # DEVELOPMENT_TEAM, CODE_SIGN_STYLE). Hardened runtime is on globally.
    dependencies:
      # Copy the daemon executable into JarvisMac.app/Contents/MacOS so a
      # shipped (notarized) build can locate it via forAuxiliaryExecutable.
      # `link: false` — it is a standalone helper tool, not linked into the app.
      # It must be signed + notarized alongside the app.
      - target: JarvisBrainDaemon
        link: false
        copy:
          destination: executables
          codeSign: true
    # Phase-2 optional drop-ins. Uncomment as you install them — the Swift
    # code is gated by `#if canImport(...)` so the project builds without
    # them.
    #
    # # Offline wake word (sherpa-onnx KWS):
    # #   Drop sherpa-onnx.xcframework at Vendor/sherpa-onnx.xcframework
    # #   then add this entry under `dependencies:`:
    # - framework: Vendor/sherpa-onnx.xcframework
    #   embed: true
    #
    # # Offline STT (whisper.cpp):
    # - package: whisper

  JarvisBrainDaemon:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: JarvisBrainDaemon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jarvis.brain.daemon
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    dependencies: []

  JarvisBrainDaemonTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: JarvisBrainDaemonTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jarvis.brain.tests
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    dependencies: []

  # Host-based unit tests for the app. Hosted on JarvisMac so the 63
  # JarvisMacTests files can `@testable import JarvisMac` against the real
  # sources. The app guards its bootstrap under XCTest (see JarvisMacApp)
  # so launching the host for tests does not hang.
  JarvisMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: JarvisMacTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jarvis.mac.tests
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/JarvisMac.app/Contents/MacOS/JarvisMac"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: JarvisMac

# Schemes — wire both test bundles into the JarvisMac scheme so
# `xcodebuild test -scheme JarvisMac` runs the app + daemon suites.
schemes:
  JarvisMac:
    build:
      targets:
        JarvisMac: all
        JarvisBrainDaemon: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - JarvisMacTests
        - JarvisBrainDaemonTests
