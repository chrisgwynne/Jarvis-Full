<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" role="img" aria-label="Android Connector Placeholder">
  <defs>
    <linearGradient id="andBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6fbff"/>
      <stop offset="100%" stop-color="#ecf4ff"/>
    </linearGradient>
    <linearGradient id="andScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f6ff"/>
    </linearGradient>
    <radialGradient id="andOrb" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="42%" stop-color="#8fd0ff"/>
      <stop offset="100%" stop-color="#3a7bff"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="560" height="380" rx="20" fill="url(#andBg)"/>
  <!-- phone body -->
  <rect x="206" y="26" width="148" height="282" rx="30" fill="#ffffff" stroke="#dde7f8" stroke-width="2"/>
  <rect x="218" y="44" width="124" height="246" rx="22" fill="url(#andScreen)"/>
  <!-- speaker notch -->
  <rect x="252" y="52" width="56" height="8" rx="4" fill="#e3ebfa"/>
  <!-- simple appliance UI: just an orb + one status line + one button -->
  <circle cx="280" cy="140" r="40" fill="url(#andOrb)"/>
  <circle cx="280" cy="140" r="40" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <text x="280" y="200" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#7e8ea8" text-anchor="middle">Connected to Mac</text>
  <rect x="240" y="222" width="80" height="30" rx="15" fill="#eaf1ff"/>
  <text x="280" y="242" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#5b6b86" text-anchor="middle">Tap to talk</text>
  <!-- label -->
  <rect x="166" y="334" width="228" height="30" rx="15" fill="#ffffff" stroke="#d4e0f5" stroke-width="1.5"/>
  <text x="280" y="354" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#5b6b86" text-anchor="middle">Android Connector Placeholder</text>
</svg>
