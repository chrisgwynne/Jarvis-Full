<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" role="img" aria-label="Windows Control Placeholder">
  <defs>
    <linearGradient id="winBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7faff"/>
      <stop offset="100%" stop-color="#ebf2ff"/>
    </linearGradient>
    <linearGradient id="winAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6aa8ff"/>
      <stop offset="100%" stop-color="#9b6bff"/>
    </linearGradient>
    <radialGradient id="winOrb" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="42%" stop-color="#8fd0ff"/>
      <stop offset="100%" stop-color="#3a7bff"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="560" height="380" rx="20" fill="url(#winBg)"/>
  <rect x="20" y="20" width="520" height="300" rx="14" fill="#ffffff" stroke="#dde7f8" stroke-width="2"/>
  <!-- title bar -->
  <rect x="20" y="20" width="520" height="34" rx="14" fill="#f2f6ff"/>
  <rect x="20" y="40" width="520" height="14" fill="#f2f6ff"/>
  <text x="44" y="42" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#9fb0cc">Jarvis · Windows Control</text>
  <rect x="494" y="32" width="12" height="12" rx="2" fill="#dde7f8"/>
  <rect x="512" y="32" width="12" height="12" rx="2" fill="#dde7f8"/>
  <!-- app tiles being launched -->
  <rect x="44" y="78" width="150" height="92" rx="12" fill="#f2f6ff"/>
  <rect x="64" y="98" width="40" height="40" rx="10" fill="url(#winAccent)" opacity="0.9"/>
  <rect x="64" y="146" width="100" height="10" rx="5" fill="#dde7f8"/>
  <rect x="206" y="78" width="150" height="92" rx="12" fill="#f2f6ff"/>
  <rect x="226" y="98" width="40" height="40" rx="10" fill="#cfe0ff"/>
  <rect x="226" y="146" width="100" height="10" rx="5" fill="#dde7f8"/>
  <rect x="368" y="78" width="148" height="92" rx="12" fill="#f2f6ff"/>
  <rect x="388" y="98" width="40" height="40" rx="10" fill="#cfe0ff"/>
  <rect x="388" y="146" width="98" height="10" rx="5" fill="#dde7f8"/>
  <!-- command strip with orb -->
  <rect x="44" y="190" width="472" height="48" rx="12" fill="#eaf1ff"/>
  <circle cx="74" cy="214" r="16" fill="url(#winOrb)"/>
  <rect x="100" y="208" width="320" height="12" rx="6" fill="#ffffff"/>
  <rect x="436" y="202" width="64" height="24" rx="12" fill="url(#winAccent)"/>
  <rect x="44" y="252" width="280" height="12" rx="6" fill="#e6edfb"/>
  <rect x="44" y="274" width="220" height="12" rx="6" fill="#e6edfb"/>
  <!-- label -->
  <rect x="166" y="334" width="228" height="30" rx="15" fill="#ffffff" stroke="#d4e0f5" stroke-width="1.5"/>
  <text x="280" y="354" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#5b6b86" text-anchor="middle">Windows Control Placeholder</text>
