<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img" aria-label="Placeholder: Jarvis assistant interface across devices">
  <defs>
    <linearGradient id="hmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7faff"/>
      <stop offset="100%" stop-color="#eaf1ff"/>
    </linearGradient>
    <linearGradient id="hmScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5ff"/>
    </linearGradient>
    <radialGradient id="hmOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#8fd0ff"/>
      <stop offset="100%" stop-color="#3a7bff"/>
    </radialGradient>
    <linearGradient id="hmBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6aa8ff"/>
      <stop offset="100%" stop-color="#9b6bff"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="720" height="520" rx="28" fill="url(#hmBg)"/>

  <!-- Laptop (Mac brain) -->
  <g>
    <rect x="70" y="90" width="420" height="270" rx="18" fill="#ffffff" stroke="#dbe5f7" stroke-width="2"/>
    <rect x="86" y="106" width="388" height="238" rx="12" fill="url(#hmScreen)"/>
    <!-- title bar dots -->
    <circle cx="108" cy="128" r="5" fill="#ff7b72"/>
    <circle cx="124" cy="128" r="5" fill="#ffd166"/>
    <circle cx="140" cy="128" r="5" fill="#5dd29a"/>
    <text x="300" y="132" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#9fb0cc" text-anchor="middle">Jarvis · Mac Brain</text>
    <!-- chat bubbles -->
    <rect x="112" y="156" width="210" height="34" rx="14" fill="#eaf1ff"/>
    <rect x="112" y="198" width="150" height="26" rx="13" fill="#eaf1ff"/>
    <rect x="240" y="234" width="222" height="34" rx="14" fill="url(#hmBar)" opacity="0.9"/>
    <rect x="290" y="278" width="172" height="26" rx="13" fill="#dfe9ff"/>
    <!-- orb -->
    <circle cx="160" cy="300" r="26" fill="url(#hmOrb)"/>
    <circle cx="160" cy="300" r="26" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <!-- laptop base -->
    <rect x="44" y="360" width="472" height="16" rx="8" fill="#e3ebfa"/>
    <rect x="250" y="360" width="60" height="16" rx="8" fill="#d3def3"/>
  </g>

  <!-- Phone (Android connector) floating -->
  <g>
    <rect x="470" y="150" width="170" height="320" rx="30" fill="#ffffff" stroke="#dbe5f7" stroke-width="2"/>
    <rect x="484" y="170" width="142" height="280" rx="22" fill="url(#hmScreen)"/>
    <rect x="528" y="178" width="54" height="10" rx="5" fill="#e3ebfa"/>
    <circle cx="555" cy="250" r="34" fill="url(#hmOrb)"/>
    <circle cx="555" cy="250" r="34" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <text x="555" y="312" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#9fb0cc" text-anchor="middle">Listening…</text>
    <rect x="506" y="338" width="98" height="22" rx="11" fill="#eaf1ff"/>
    <rect x="506" y="372" width="76" height="18" rx="9" fill="#eaf1ff"/>
    <rect x="506" y="404" width="98" height="22" rx="11" fill="url(#hmBar)" opacity="0.85"/>
  </g>

  <!-- placeholder label -->
  <g opacity="0.9">
    <rect x="250" y="442" width="220" height="30" rx="15" fill="#ffffff" stroke="#d4e0f5" stroke-width="1.5"/>
    <text x="360" y="462" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#5b6b86" text-anchor="middle">Product UI Placeholder</text>
  </g>
</svg>
