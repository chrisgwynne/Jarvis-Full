<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" role="img" aria-label="Mac Brain Dashboard Placeholder">
  <defs>
    <linearGradient id="macBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7faff"/>
      <stop offset="100%" stop-color="#ecf2ff"/>
    </linearGradient>
    <radialGradient id="macOrb" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#8fd0ff"/>
      <stop offset="100%" stop-color="#3a7bff"/>
    </radialGradient>
    <linearGradient id="macAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6aa8ff"/>
      <stop offset="100%" stop-color="#9b6bff"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="560" height="380" rx="20" fill="url(#macBg)"/>
  <rect x="20" y="20" width="520" height="300" rx="16" fill="#ffffff" stroke="#dde7f8" stroke-width="2"/>
  <!-- window chrome -->
  <circle cx="44" cy="44" r="5" fill="#ff7b72"/>
  <circle cx="60" cy="44" r="5" fill="#ffd166"/>
  <circle cx="76" cy="44" r="5" fill="#5dd29a"/>
  <text x="280" y="48" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#9fb0cc" text-anchor="middle">Jarvis Brain</text>
  <!-- sidebar -->
  <rect x="36" y="70" width="120" height="232" rx="10" fill="#f2f6ff"/>
  <rect x="50" y="86" width="92" height="14" rx="7" fill="#dde7f8"/>
  <rect x="50" y="110" width="78" height="12" rx="6" fill="#e6edfb"/>
  <rect x="50" y="130" width="86" height="12" rx="6" fill="#e6edfb"/>
  <rect x="50" y="150" width="70" height="12" rx="6" fill="#e6edfb"/>
  <rect x="50" y="170" width="82" height="12" rx="6" fill="#e6edfb"/>
  <!-- main panel orb -->
  <circle cx="300" cy="150" r="40" fill="url(#macOrb)"/>
  <circle cx="300" cy="150" r="40" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <rect x="220" y="210" width="240" height="16" rx="8" fill="#eaf1ff"/>
  <rect x="244" y="234" width="192" height="14" rx="7" fill="url(#macAccent)" opacity="0.85"/>
  <rect x="236" y="258" width="208" height="14" rx="7" fill="#e6edfb"/>
  <!-- label -->
  <rect x="150" y="334" width="260" height="30" rx="15" fill="#ffffff" stroke="#d4e0f5" stroke-width="1.5"/>
  <text x="280" y="354" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#5b6b86" text-anchor="middle">Mac Brain Dashboard Placeholder</text>
</svg>
