name: Windows CI

on:
  push:
    paths:
      - 'Windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + test
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Windows
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: set -o pipefail; dotnet restore Jarvis.sln 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - name: Build
        run: set -o pipefail; dotnet build Jarvis.sln -c Release --no-restore 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - name: Test
        run: set -o pipefail; dotnet test Jarvis.sln -c Release --no-build --verbosity normal 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - name: Report failure to PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### ❌ Windows CI failed";
            echo "Commit \`$GITHUB_SHA\` · [run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)";
            echo '';
            echo 'Unique error lines:';
            echo '```';
            grep -iE "(: error|error:|error CS| error |FAILED|FAILURE|Exception|Unresolved reference|cannot find|could not|Unable to|not found)" "$RUNNER_TEMP/ci.log" 2>/dev/null | awk '!seen[$0]++' | head -n 60 || echo "(no error lines matched; see run)";
            echo '```';
          } > "$RUNNER_TEMP/comment.md"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/8/comments" -F "body=@$RUNNER_TEMP/comment.md" || true
