name: Android CI

# Canonical Android CI (repo root so Actions discovers it — the old
# Android/.github/ workflows never ran). On failure it posts the tail of
# the build log to PR #8 so failures are visible without log download access.
on:
  push:
    paths:
      - 'Android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assemble + test + lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Android
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # JDK 21 matches gradle/gradle-daemon-jvm.properties (toolchainVersion=21).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble debug
        run: set -o pipefail; ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - name: Unit tests
        run: set -o pipefail; ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - name: Lint
        run: set -o pipefail; ./gradlew --no-daemon --stacktrace lintDebug 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - name: Report failure to PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### ❌ Android CI failed";
            echo "Commit \`$GITHUB_SHA\` · [run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)";
            echo '';
            echo 'Unique error lines:';
            echo '```';
            grep -iE "(e: file|: error|error:|error CS| error |FAILED|FAILURE|Exception|Unresolved reference|cannot find|could not|Unable to|not found|unable to type-check)" "$RUNNER_TEMP/ci.log" 2>/dev/null | awk '!seen[$0]++' | head -n 80 || echo "(no error lines matched; see run)";
            echo '```';
          } > "$RUNNER_TEMP/comment.md"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/8/comments" -F "body=@$RUNNER_TEMP/comment.md" || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            Android/app/build/reports/**
            Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7
